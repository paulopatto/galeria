---
name-template: 'Galeria: v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '✨ Features'
    labels:
      - 'feat'
      - 'breaking-change' # Or keep 'pr:breaking-change if you prefer prefixed labels for this one.
  - title: '🐞 Bug Fixes'
    labels:
      - 'fix'
  - title: '🔧 Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'build'
      - 'ci'
      - 'docs'
      - 'style'
      - 'revert'
      - 'test'
      - 'perf'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  major:
    labels:
      - 'breaking-change'
  minor:
    labels:
      - 'feat'
  patch:
    labels:
      - 'fix'
      - 'chore'
      - 'refactor'
      - 'build'
      - 'ci'
      - 'docs'
      - 'style'
      - 'revert'
      - 'test'
      - 'perf'

  default: patch
template: |
  ## Changes on $REPOSITORY

  $CHANGES
autolabeler:
  - label: 'breaking-change'
    body: '/breaking change/i'
    title: '/^[a-z]+\([^)]+\)!: /i'
  - label: 'feat'
    title: '/^feat\([^)]+\)!?: /i'
  - label: 'fix'
    title: '/^fix\([^)]+\)!?: /i'
  - label: 'chore'
    title: '/^chore\([^)]+\)!?: /i'
  - label: 'refactor'
    title: '/^refactor\([^)]+\)!?: /i'
  - label: 'build'
    title: '/^build\([^)]+\)!?: /i'
  - label: 'ci'
    title: '/^ci\([^)]+\)!?: /i'
  - label: 'docs'
    title: '/^docs\([^)]+\)!?: /i'
  - label: 'style'
    title: '/^style\([^)]+\)!?: /i'
  - label: 'revert'
    title: '/^revert\([^)]+\)!?: /i'
  - label: 'test'
    title: '/^test\([^)]+\)!?: /i'
  - label: 'perf'
    title: '/^perf\([^)]+\)!?: /i'
