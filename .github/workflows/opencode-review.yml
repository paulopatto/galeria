name: OpenCode PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Forks and Dependabot do not receive the required Actions secret.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    env:
      CODE_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CODE_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # PR comments/reactions need write access to the pull request resource.
      pull-requests: write
      issues: write
    steps:
      - name: Check OpenCode credentials
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::Configure the OPENCODE_API_KEY Actions secret. See docs/automated-code-review.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/code-review-evidence"

      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Review with code-reviewer
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # github-v1.2.19 (latest)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_REVIEW_DECISION_PATH: ${{ runner.temp }}/code-review-evidence/decision.json
        with:
          model: opencode/big-pickle
          agent: code-reviewer
          use_github_token: true
          share: false
          prompt: |
            Revise o diff completo deste PR seguindo o agente code-reviewer.
            Responda em português: resumo curto com o commit e apenas achados
            acionáveis com severidade, arquivo/linha, impacto e correção.
            Coloque comandos, limitações e evidências em <details> com o título
            "Detalhes da análise". Não esconda achados relevantes no toggle.
            Não altere código; a action publicará sua resposta final no PR.
            Grave também a decisão estruturada em CODE_REVIEW_DECISION_PATH,
            conforme o schema e as regras do perfil code-reviewer. O próximo
            passo publicará a aprovação, solicitação de alterações ou comentário.

      - name: Publish formal review decision
        env:
          CODE_REVIEW_DECISION_PATH: ${{ runner.temp }}/code-review-evidence/decision.json
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.CODE_REVIEW_DECISION_PATH, 'utf8'));
            const expectedSha = context.payload.pull_request.head.sha;
            const severities = ['critical', 'high', 'medium', 'low'];
            const nonempty = value => typeof value === 'string' && value.trim().length > 0;
            if (report.commit_sha !== expectedSha || typeof report.analysis_complete !== 'boolean' ||
                !nonempty(report.summary) || !Array.isArray(report.findings)) {
              throw new Error('Missing or invalid structured review for the expected commit. No approval was sent.');
            }
            for (const finding of report.findings) {
              if (!finding || !severities.includes(finding.severity) ||
                  !['title', 'file', 'impact', 'correction'].every(key => nonempty(finding[key])) ||
                  !Number.isInteger(finding.line) || finding.line < 1) {
                throw new Error('Invalid finding in structured review. No approval was sent.');
              }
            }
            const params = { ...context.repo, pull_number: context.payload.pull_request.number };
            const { data: pr } = await github.rest.pulls.get(params);
            if (pr.head.sha !== expectedSha || pr.state !== 'open') {
              core.notice('Skipping stale review: the pull request changed or was closed during analysis.');
              return;
            }
            const blocking = report.findings.some(finding => ['critical', 'high'].includes(finding.severity));
            const medium = report.findings.some(finding => finding.severity === 'medium');
            let event = blocking ? 'REQUEST_CHANGES' :
              (!report.analysis_complete || medium ? 'COMMENT' : 'APPROVE');
            const notes = [];
            if (!report.analysis_complete) notes.push('Análise incompleta: veja a limitação no resumo.');
            if (pr.draft && event === 'APPROVE') {
              event = 'COMMENT';
              notes.push('PR em draft: aprovação adiada até estar pronto para revisão.');
            }
            const labels = { critical: 'CRÍTICA', high: 'ALTA', medium: 'MÉDIA', low: 'BAIXA' };
            const decisions = { REQUEST_CHANGES: 'Solicitar alterações', COMMENT: 'Comentar', APPROVE: 'Aprovar' };
            const findings = report.findings.map(finding =>
              `- **[${labels[finding.severity]}] ${finding.title} — ${finding.file}:${finding.line}**\n` +
              `  Impacto: ${finding.impact}\n  Correção: ${finding.correction}`);
            const body = [report.summary, `Commit analisado: ${expectedSha}. Decisão: ${decisions[event]}.`,
              ...notes, ...findings].join('\n\n');
            await github.rest.pulls.createReview({ ...params, commit_id: expectedSha, event, body });
            core.info(`Formal review submitted: ${event} for ${expectedSha}`);

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-review-evidence-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/code-review-evidence
          if-no-files-found: ignore
          retention-days: 7

  unavailable:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.actor == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Explain unavailable review
        run: |
          echo 'Revisão OpenCode não executada: PR de fork ou Dependabot sem acesso ao secret e token de escrita necessários. Consulte docs/automated-code-review.md.' >> "$GITHUB_STEP_SUMMARY"

